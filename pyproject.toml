[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "viasign-parser"
version = "0.2.1"
description = "Review-required ViaSign surface-analysis prototype"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Viathorne" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.10,<3.0",
  "starlette>=1.3.1,<2.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "jsonschema>=4.23,<5.0",
  "pytest>=8.0,<9.0",
]

[project.scripts]
viasign-api = "viasign_parser.api:run"

[tool.hatch.build.targets.wheel]
packages = ["src/viasign_parser"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
